[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asd_mcda"
version = "1.0.0"
description = "Integrated Computational Polymer Screening and QbD Failure Mapping Framework for SD-ASDs"
readme = "README.md"
authors = [
    { name = "Tushar Mathapati" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.1",
    "SALib>=1.4.7",
]

[project.scripts]
asd-mcda = "asd_mcda.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
